name: Jules auto-fix (sandbox only)

# A failed CI run on the sandbox PR asks Jules to propose a fix. Jules opens
# a separate PR; CI tests that PR, and a developer decides whether to merge it.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

env:
  JULES_SOURCE: sources/github/DD2482-project/devops-regression-ci-demo

jobs:
  trigger-jules:
    # Only the original, same-repository sandbox PR starts Jules.
    # Jules's new PR has a different head branch, preventing loops.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'jules-sandbox' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - name: Ask Jules to fix the failing sandbox branch
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${JULES_API_KEY:-}" ]]; then
            echo "JULES_API_KEY is not configured" >&2
            exit 1
          fi

          prompt="CI failed on ${BRANCH} at commit ${FAILED_HEAD_SHA}. Failed run: ${FAILED_RUN_URL}. Run the full pytest suite and inspect its failures. Fix the failing code under scratch/ so all tests pass. Do not change files outside scratch/, and do not merge the fix. Open a pull request against ${BRANCH} for developer review."

          payload=$(jq -n \
            --arg prompt "$prompt" \
            --arg source "$JULES_SOURCE" \
            --arg branch "$BRANCH" \
            '{
               prompt: $prompt,
               sourceContext: {
                 source: $source,
                 githubRepoContext: { startingBranch: $branch }
               },
               requirePlanApproval: false,
               automationMode: "AUTO_CREATE_PR"
             }')

          echo "Creating Jules session for failed CI run: $FAILED_RUN_URL"
          response=$(curl --fail-with-body -sS -X POST "https://jules.googleapis.com/v1alpha/sessions" \
            -H "x-goog-api-key: ${JULES_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$payload")
          session=$(jq -er '.name | select(startswith("sessions/"))' <<< "$response")
          echo "Jules session created: $session"
          echo "Jules session: $session" >> "$GITHUB_STEP_SUMMARY"
          echo "Failed CI run: $FAILED_RUN_URL" >> "$GITHUB_STEP_SUMMARY"

          # The session is asynchronous. Keep the run visible until Jules
          # creates its PR, fails, or reaches the time limit.
          for ((attempt = 1; attempt <= 40; attempt++)); do
            result=$(curl --fail-with-body -sS \
              -H "x-goog-api-key: ${JULES_API_KEY}" \
              "https://jules.googleapis.com/v1alpha/${session}")
            pr_url=$(jq -r '[.outputs[]?.pullRequest.url // empty][0] // empty' <<< "$result")
            if [[ -n "$pr_url" ]]; then
              echo "Jules fix PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
              echo "Jules opened fix PR: $pr_url"
              exit 0
            fi

            state=$(jq -r '.state // "UNKNOWN"' <<< "$result")
            echo "Jules session state: $state (check $attempt/40)"
            if [[ "$state" == "FAILED" || "$state" == "COMPLETED" ]]; then
              echo "Jules finished without opening a fix PR" >&2
              exit 1
            fi
            sleep 30
          done

          echo "Timed out waiting for Jules to open a fix PR" >&2
          exit 1
